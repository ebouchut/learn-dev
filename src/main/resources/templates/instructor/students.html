<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Students — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header('instructor')}"></th:block>

  <main class="site-main" id="main" tabindex="-1">
    <p class="alert alert--info" role="status" th:if="${param.dropped}">
      The student has been removed from the course.
    </p>

    <p class="course-card__meta">
      <a th:href="@{/instructor/courses/{id}/edit(id=${course.courseId})}"
         th:text="${course.title}">Course title</a>
    </p>

    <h1 class="page-title">Students</h1>

    <p th:if="${#lists.isEmpty(enrollments)}">No student has enrolled yet.</p>

    <table class="table" th:unless="${#lists.isEmpty(enrollments)}">
      <caption class="visually-hidden"
               th:text="'Students enrolled in ' + ${course.title}">Roster</caption>
      <thead>
        <tr>
          <th scope="col">Student</th>
          <th scope="col">Status</th>
          <th scope="col">Enrolled on</th>
          <th scope="col">Left on</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="enrollment : ${enrollments}">
          <td th:text="${enrollment.user.username}">student</td>
          <td th:text="${#strings.capitalize(#strings.toLowerCase(
              #strings.replace(enrollment.status.name(), '_', ' ')))}">Enrolled</td>
          <td th:text="${#temporals.format(enrollment.enrolledAt, 'd MMMM yyyy')}">date</td>
          <td th:text="${enrollment.droppedAt != null}
                       ? ${#temporals.format(enrollment.droppedAt, 'd MMMM yyyy')} : '-'">-</td>
          <td>
            <form th:if="${enrollment.status.name() == 'ENROLLED'
                          || enrollment.status.name() == 'IN_PROGRESS'}"
                  th:action="@{/instructor/courses/{c}/students/{u}/drop(
                             c=${course.courseId}, u=${enrollment.user.userId})}"
                  method="post">
              <button class="button button--ghost" type="submit">Remove
                <span class="visually-hidden"
                      th:text="': ' + ${enrollment.user.username}"></span></button>
            </form>
          </td>
        </tr>
      </tbody>
    </table>

    <p><a th:href="@{/instructor/courses}">Back to my courses</a></p>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
