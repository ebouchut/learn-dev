<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Dashboard — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header('dashboard')}"></th:block>

  <main class="site-main" id="main" tabindex="-1">
    <p class="alert alert--success" role="status" th:if="${param['verification-sent']}">
      Verification email sent. Check your inbox.
    </p>
    <div class="alert alert--info" role="status" th:unless="${emailVerified}">
      Your email address is not verified yet. Open the link we sent you, or
      <form class="form--inline" th:action="@{/auth/verify/resend}" method="post">
        <button class="button button--ghost" type="submit">resend the email</button>
      </form>
    </div>

    <h1 class="page-title">
      Welcome back, <strong sec:authentication="name">user</strong> 👋
    </h1>

    <section aria-labelledby="courses-title">
      <h2 id="courses-title">Your courses</h2>

      <p th:if="${#lists.isEmpty(enrollments)}">
        You are not enrolled in any course yet.
        <a th:href="@{/courses}">Browse the courses</a> to get started.
      </p>

      <ul class="course-list" th:unless="${#lists.isEmpty(enrollments)}">
        <li class="course-card" th:each="enrollment : ${enrollments}">
          <h3 class="course-card__title">
            <a th:href="@{/courses/{id}(id=${enrollment.course.courseId})}"
               th:text="${enrollment.course.title}">Course title</a>
          </h3>
          <p class="course-card__meta">
            <span th:text="${#strings.capitalize(#strings.toLowerCase(
                #strings.replace(enrollment.status.name(), '_', ' ')))}">Enrolled</span>
            &middot; since
            <span th:text="${#temporals.format(enrollment.enrolledAt, 'd MMMM yyyy')}">date</span>
          </p>
        </li>
      </ul>
    </section>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
