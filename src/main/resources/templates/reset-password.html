<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reset password — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header(null)}"></th:block>

  <main class="site-main site-main--narrow" id="main" tabindex="-1" th:object="${form}">

    <!-- Invalid, expired, or already used link -->
    <th:block th:if="${!tokenValid}">
      <p class="alert alert--error" role="alert">
        This reset link is invalid, expired, or has already been used.
      </p>
      <div class="form-card">
        <h1 class="form-card__title">Reset password</h1>
        <p>
          Reset links are single use and expire after 30 minutes.
          You can <a th:href="@{/auth/forgot-password}">request a new one</a>.
        </p>
      </div>
    </th:block>

    <!-- Valid token: choose the new password -->
    <div class="form-card" th:if="${tokenValid}">
      <h1 class="form-card__title">Reset password</h1>

      <form th:action="@{/auth/reset-password}" method="post">
        <input type="hidden" th:field="*{token}">

        <div class="form__group">
          <label class="form__label" for="password">New password</label>
          <span class="form__hint" id="password-hint">8 to 100 characters.</span>
          <input class="form__input" type="password" th:field="*{password}"
                 autocomplete="new-password" required
                 th:classappend="${#fields.hasErrors('password')} ? 'form__input--invalid'"
                 th:attr="aria-invalid=${#fields.hasErrors('password')} ? 'true' : null,
                          aria-describedby=${#fields.hasErrors('password')} ? 'password-hint password-error' : 'password-hint'">
          <span class="form__error" id="password-error"
                th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <button class="button button--primary" type="submit">Change my password</button>
      </form>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
