<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header('login')}"></th:block>

  <main class="site-main site-main--narrow" id="main" tabindex="-1" th:object="${form}">
    <!-- Always the same message, whatever the email (enumeration-safe). -->
    <p class="alert alert--success" role="status" th:if="${param.sent}">
      If an account exists for this address, a reset link is on its way.
      The link is valid for 30 minutes.
    </p>

    <div class="form-card">
      <h1 class="form-card__title">Forgot password</h1>
      <p class="form__hint">
        Enter your account email; we will send you a single-use reset link.
      </p>

      <form th:action="@{/auth/forgot-password}" method="post">
        <div class="form__group">
          <label class="form__label" for="email">Email</label>
          <input class="form__input" type="email" th:field="*{email}"
                 autocomplete="email" required
                 th:classappend="${#fields.hasErrors('email')} ? 'form__input--invalid'"
                 th:attr="aria-invalid=${#fields.hasErrors('email')} ? 'true' : null,
                          aria-describedby=${#fields.hasErrors('email')} ? 'email-error' : null">
          <span class="form__error" id="email-error"
                th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </div>

        <button class="button button--primary" type="submit">Send the reset link</button>
      </form>

      <p class="form__footer">
        Remembered it? <a th:href="@{/auth/login}">Log in</a>.
      </p>
    </div>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
