<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Lesson — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header('courses')}"></th:block>

  <main class="site-main" id="main" tabindex="-1">
    <p class="course-card__meta">
      <a th:href="@{/courses/{id}(id=${course.courseId})}"
         th:text="${course.title}">Course title</a>
    </p>

    <div class="lesson-layout">
      <!-- The TOC precedes the content in the DOM (assistive tech meets
           the navigation aid first); the grid places it visually right
           on wide screens. Sticky via CSS, scroll-spy via lesson-toc.js
           (ADR-0018). Shown from 2 entries: a one-heading TOC is noise. -->
      <aside class="lesson-layout__toc" th:if="${#lists.size(toc) >= 2}">
        <details class="lesson-toc">
          <summary class="lesson-toc__summary">Contents</summary>
          <nav aria-label="Contents">
            <ol class="lesson-toc__list">
              <!-- Indent level via data attribute: BEM's double underscore
                   collides with Thymeleaf's __preprocessing__ syntax when
                   built dynamically. -->
              <li class="lesson-toc__item" th:each="entry : ${toc}"
                  th:attr="data-level=${entry.level}">
                <a class="lesson-toc__link" th:href="|#${entry.id}|"
                   th:text="${entry.text}">Section</a>
              </li>
            </ol>
          </nav>
        </details>
      </aside>
      <article class="lesson-layout__content">
        <h1 class="page-title" th:text="${lesson.title}">Lesson title</h1>
        <!-- contentHtml is rendered and sanitized by MarkdownRenderer (ADR-0013). -->
        <div class="lesson-content" th:utext="${contentHtml}">Lesson content</div>
      </article>
    </div>

    <nav aria-label="Lesson">
      <p>
        <a class="button button--ghost" th:if="${previousLesson}"
           th:href="@{/courses/{c}/lessons/{l}(c=${course.courseId}, l=${previousLesson.lessonId})}">
          Previous: <span th:text="${previousLesson.title}">previous lesson</span></a>
        <a class="button button--primary" th:if="${nextLesson}"
           th:href="@{/courses/{c}/lessons/{l}(c=${course.courseId}, l=${nextLesson.lessonId})}">
          Next: <span th:text="${nextLesson.title}">next lesson</span></a>
      </p>
    </nav>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>

  <!-- Client-side diagram rendering (ADR-0016): lesson-mermaid.js loads
       the Mermaid bundle below only when the lesson contains a
       mermaid fence. Version also pinned in pom.xml (mermaid.version). -->
  <script defer th:src="@{/js/lesson-mermaid.js}"
          th:attr="data-mermaid-src=@{/webjars/mermaid/11.15.0/dist/mermaid.min.js}"></script>
  <!-- Client-side syntax highlighting (ADR-0017): lesson-highlight.js
       loads the bundle below only when the lesson has a language-tagged
       code fence. Version also pinned in pom.xml (highlightjs.version). -->
  <script defer th:src="@{/js/lesson-highlight.js}"
          th:attr="data-hljs-src=@{/webjars/highlightjs__cdn-assets/11.11.1/highlight.min.js}"></script>
  <!-- TOC enhancement (ADR-0018): opens the panel on wide screens and
       marks the current section with aria-current while scrolling. -->
  <script defer th:src="@{/js/lesson-toc.js}"></script>
</body>
</html>
