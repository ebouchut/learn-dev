<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Course — learn-dev')}"></head>
<body>
  <th:block th:replace="~{fragments/layout :: header('courses')}"></th:block>

  <main class="site-main" id="main" tabindex="-1">
    <h1 class="page-title" th:text="${course.title}">Course title</h1>
    <p class="course-card__meta">
      By <span th:text="${course.instructor.username}">instructor</span>
    </p>

    <p th:if="${course.description}" th:text="${course.description}">
      Course description
    </p>

    <section aria-labelledby="lessons-title">
      <h2 id="lessons-title">Lessons</h2>
      <p th:if="${#lists.isEmpty(lessons)}">No lesson is published yet.</p>
      <ol th:unless="${#lists.isEmpty(lessons)}">
        <li th:each="lesson : ${lessons}" th:text="${lesson.title}">Lesson title</li>
      </ol>
    </section>

    <p><a th:href="@{/courses}">Back to all courses</a></p>
  </main>

  <th:block th:replace="~{fragments/layout :: footer}"></th:block>
</body>
</html>
