<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="#8230e8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
  <!-- learn-dev mark: an open book drawn as two code chevrons and a spine.
       A tab icon cannot read the page theme tokens, so the light and dark
       strokes hard-code the two theme primary values. -->
  <style>@media (prefers-color-scheme: dark) { svg { stroke: #cba6f7; } }</style>
  <path d="M8.5 5.5 2.5 12l6 6.5"/>
  <path d="M15.5 5.5 21.5 12l-6 6.5"/>
  <path d="M12 6v12"/>
</svg>
