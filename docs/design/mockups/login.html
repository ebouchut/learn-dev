<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — learn-dev</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme-catppuccin.css">
  <link rel="stylesheet" href="css/base.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="home.html">learn<span class="site-header__brand-mark">-dev</span></a>
      <nav class="site-header__nav" aria-label="Main">
        <ul class="nav__list">
          <li><a class="nav__link" href="home.html">Home</a></li>
          <li><a class="nav__link" href="login.html" aria-current="page">Log in</a></li>
          <li><a class="button button--primary" href="register.html">Sign up</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="site-main site-main--narrow" id="main">
    <!-- Mockup state: arriving from a successful registration -->
    <p class="alert alert--success reveal" role="status">
      Account created, please log in.
    </p>

    <div class="form-card reveal reveal--2">
      <h1 class="form-card__title">Log in</h1>

      <form action="#" method="post" novalidate>
        <div class="form__group">
          <label class="form__label" for="username">Username</label>
          <input class="form__input" type="text" id="username" name="username"
                 autocomplete="username" required>
        </div>

        <div class="form__group">
          <label class="form__label" for="password">Password</label>
          <input class="form__input" type="password" id="password" name="password"
                 autocomplete="current-password" required>
        </div>

        <button class="button button--primary" type="submit">Log in</button>
      </form>

      <p class="form__footer">
        No account yet? <a href="register.html">Create one</a>.
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>learn-dev — an interactive programming learning platform.</p>
      <p><a href="https://github.com/ebouchut/learn-dev">Source on GitHub</a></p>
    </div>
  </footer>
</body>
</html>
